# Runs the pipeline on a schedule, commits new data, and publishes the dashboard
# to GitHub Pages. No manual step is needed once this is on GitHub.
name: Update river data

on:
  schedule:
    - cron: "30 1 * * *"   # daily 07:00 IST; Sentinel-2 passes every few days, extra runs are cheap no-ops
    - cron: "30 13 * * *"  # and 19:00 IST, so a late or dropped scheduled run never leaves the site a day behind
    - cron: "0 2 15 10 *"  # 15 Oct: after the monsoon, rebuild the river area and flood test
    - cron: "0 3 1 * *"    # 1st of each month: compare new Landsat 8/9 images with Sentinel-2
  push:                    # publish code changes right away (the bot's own data commits don't trigger this)
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Per-pixel values of past images, so rebuilds don't download everything again.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: pixel-cache-${{ github.run_id }}
          restore-keys: pixel-cache-

      - name: Test
        run: uv run pytest -q

      - name: Rebuild river area (yearly, after the monsoon)
        if: github.event.schedule == '0 2 15 10 *'
        run: uv run python pipeline/build_river_mask.py

      - name: Cross-check with Landsat (monthly)
        if: github.event.schedule == '0 3 1 * *'
        run: uv run python pipeline/crosscheck_landsat.py --new

      - name: Run pipeline
        run: uv run python pipeline/run.py

      # Sharp images of the watched roads, bought from UP42 within the caps in config/roadside.yaml.
      # Does nothing until the UP42_USERNAME / UP42_PASSWORD secrets exist. A UP42 problem (wrong
      # password, a data licence not yet accepted in the UP42 console) fails only this step.
      - name: Buy sharp images (UP42)
        continue-on-error: true
        env:
          UP42_USERNAME: ${{ secrets.UP42_USERNAME }}
          UP42_PASSWORD: ${{ secrets.UP42_PASSWORD }}
        run: uv run python pipeline/up42_fetch.py

      # Roadside watch: re-tracks and republishes from the committed detections (data/roadside/<site>/),
      # so most days it needs no detectors. Images themselves aren't committed; if a downloader has
      # put new ones in data/roadside/images/, the detectors are installed and run on them first.
      # With no detections yet, the page keeps its example data.
      - name: Roadside watch
        run: |
          # Land change from free Sentinel-2 images: adds any new month (cached in data/cache/).
          uv run python pipeline/roadside_land.py
          if compgen -G "data/roadside/images/*/*.tif" > /dev/null; then
            uv run --group detect python pipeline/roadside.py
          else
            uv run python pipeline/roadside.py
          fi

      - name: Check published data
        run: uv run pytest -q -k published

      - name: Commit new data
        run: |
          git config user.name "river-watch-bot"
          git config user.email "river-watch-bot@users.noreply.github.com"
          git add data/history data/masks data/validation data/roadside web/data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F)"
          # A code push can land while this runs; put the data commit on top of it instead of failing.
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Load the deployed site and compare it with the repository: pages, scripts and data must be
  # this commit's, and the newest image recent. Retries while GitHub Pages' cache catches up.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # includes the data commit this run may have just pushed

      - uses: astral-sh/setup-uv@v6

      - name: Check the live site
        env:
          SITE_URL: https://rig-consultancy.github.io/river-watch/
        run: |
          for attempt in 1 2 3 4 5 6; do
            uv run pytest -q -k live && exit 0
            sleep 30
          done
          exit 1
