# Rivers monitored by the pipeline. Adding a river = adding an entry here.
# bbox: [min_lon, min_lat, max_lon, max_lat]
# osm_names: regex matched against OSM river names inside the bbox.

rivers:
  - id: mula-mutha-pune
    name: Mula-Mutha (Pune)
    name_mr: मुळा-मुठा (पुणे)
    bbox: [73.72, 18.44, 74.02, 18.62]
    osm_names: "Mula|Mutha"

# Detection thresholds (Sentinel-2 L2A surface reflectance).
detection:
  max_scene_cloud: 40        # skip scenes with more cloud than this (%)
  min_valid_fraction: 0.6    # skip dates where < 60% of river pixels are cloud-free
  hyacinth_ndvi: 0.30        # floating vegetation on water
  turbid_ndti: 0.05          # (red - green) / (red + green) on open water; higher = muddier
  water_ndwi: 0.0            # (green - nir) / (green + nir) above this = open water
  range_ndvi_delta: 0.05     # likely range also counts hyacinth at NDVI 0.25 and 0.35
  segment_length_m: 500      # river is split into segments of this length
  river_buffer_m: 25         # half-width used when OSM has only a centreline
  corridor_m: 150            # search this far either side of the centreline for the real channel
  lookback_days: 45          # how far back to look for usable scenes each run

# Which pixels count as river, decided from the images: within corridor_m of the centreline and
# open water on at least min_water_share of clear dates (hyacinth mats are flushed by the monsoon
# and show water for weeks; bank trees, islands and dry vegetated riverbed never do). Built by
# pipeline/build_river_mask.py into data/masks/; until then the OpenStreetMap outline is used.
river_mask:
  min_water_share: 0.15      # open water on at least this share of clear dates
  min_clear_dates: 20        # need this many clear looks at a pixel to decide
  channel_m: 50              # keep only water areas within this distance of the centreline
  fill_holes_m2: 2000        # count gaps smaller than this inside the channel as river
  min_green_share: 0.6       # inside the OSM outline, never water but green this often: "green channel"

# Sentinel-1 radar sees through clouds. Its hyacinth threshold is calibrated automatically
# against days when an optical image was taken within radar_pair_days of a radar pass.
radar:
  pair_days: 2               # optical and radar images this close count as the same day
  min_pairs: 5               # radar is hidden until this many calibration pairs exist
  min_coverage: 0.9          # skip radar passes that cover less of the river than this

# How far to trust each 500 m stretch. High needs at least high_px river pixels (100 m² each)
# with at most high_edge_share of them on the river edge (mixed water/bank pixels). Low: fewer
# than low_px, mostly edge pixels, or two or more problems.
confidence:
  high_px: 150
  low_px: 60
  high_edge_share: 0.5
  low_edge_share: 0.75
  green_channel_share: 0.3   # flag a stretch when this much of its channel is green all year

# Bad images and one-off jumps. A date is left out for heavy haze (aerosol optical thickness
# above max_aot; normal here is 0.1-0.6), or when cloud covers at least cloud_share of the river
# corridor AND its river-wide figures differ from the images within 3 weeks by more than max_z
# robust standard deviations. A stretch reading is a one-off jump when it differs by more than
# spike_pts from both neighbouring readings (each within 2 weeks) while those two agree.
quality:
  max_aot: 0.8
  cloud_share: 0.1
  max_z: 3
  spike_pts: 15

# Municipal corporations: each stretch is tagged with the one it runs through (a stretch whose
# banks fall in both is a border stretch and counts towards both). See data/regions/README.md.
regions:
  - id: pmc
    name: Pune (PMC)
    name_mr: पुणे (मनपा)
    file: data/regions/pmc-wards-2022.geojson
    ward_field: Name1
  - id: pcmc
    name: Pimpri-Chinchwad (PCMC)
    name_mr: पिंपरी-चिंचवड (मनपा)
    file: data/regions/pcmc-wards.geojson
    ward_field: name

# 2-week outlook. Backtests on this river showed that extending the recent trend is less
# accurate than the smoothed current level, so the outlook is that level plus the error
# range seen in backtests, and per stretch the chance of being above alert_pct.
outlook:
  horizon_days: 14
  alert_pct: 30
