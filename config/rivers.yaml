# Rivers monitored by the pipeline. Adding a river = adding an entry here.
# bbox: [min_lon, min_lat, max_lon, max_lat]
# osm_names: regex matched against OSM river names inside the bbox.

rivers:
  - id: mula-mutha-pune
    name: Mula-Mutha (Pune)
    bbox: [73.72, 18.44, 74.02, 18.62]
    osm_names: "Mula|Mutha"

# Detection thresholds (Sentinel-2 L2A surface reflectance).
detection:
  max_scene_cloud: 40        # skip scenes with more cloud than this (%)
  min_valid_fraction: 0.6    # skip dates where < 60% of river pixels are cloud-free
  hyacinth_ndvi: 0.30        # floating vegetation on water
  turbid_ndti: 0.05          # (red - green) / (red + green); higher = muddier
  segment_length_m: 500      # river is split into segments of this length
  river_buffer_m: 25         # half-width used when OSM has only a centreline
  lookback_days: 45          # how far back to look for usable scenes each run

# Sentinel-1 radar sees through clouds. Its hyacinth threshold is calibrated automatically
# against days when an optical image was taken within radar_pair_days of a radar pass.
radar:
  pair_days: 2               # optical and radar images this close count as the same day
  min_pairs: 5               # radar is hidden until this many calibration pairs exist
  min_coverage: 0.9          # skip radar passes that cover less of the river than this
